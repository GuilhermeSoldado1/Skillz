<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CRUD</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    
    <div class="container d-flex justify-content-center align-items-center">
        <div class="card" style="width: 40rem;">
            <div class="card-header text-center">Login</div>
            <div class="card-body">
                    <div class="mb-3">
                        <label for="utilizador" class="form-label">utilizador</label>
                        <input type="text" class="form-control" id="utilizador" name="utilizador" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <button type="button" class="btn btn-primary w-100" onclick="registar()">Entrar</button>
            </div>
        </div>
    </div>

    <div class="container d-flex justify-content-center align-items-center my-2">
        <div class="card" style="width: 24rem;">
            <div class="card-header text-center">Login</div>
            <div class="card-body">
                <form id="formLogin">
                    <div class="mb-3">
                        <label for="utilizador" class="form-label">utilizador</label>
                        <input type="text" class="form-control" id="utilizador" name="utilizador" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <button type="button" class="btn btn-primary w-100" onclick="registar()">Entrar</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Navbar é injetada aqui -->
    <div id="navbar"></div>

    <div class="container my-4">

        <!-- CREATE -->
        <div class="card mb-4">
            <div class="card-header">Registar</div>
            <div class="card-body">
                <form id="formCreate">
                    <div class="row g-3">
                        <div class="col-6">
                            <label for="campo1" class="form-label">campo1</label>
                            <input type="text" class="form-control" id="campo1" name="campo1">
                        </div>
                        <div class="col-6">
                            <label for="campo2" class="form-label">campo2</label>
                            <input type="text" class="form-control" id="campo2" name="campo2">
                        </div>
                        <div class="col-6">
                            <label for="campo3" class="form-label">campo3 (select)</label>
                            <select class="form-select" id="campo3" name="campo3" multiple>
                                <option value="" disabled>-- escolher --</option>
                                <option value="opcao1">opcao1</option>
                                <option value="opcao1">opcao2</option>
                                <option value="opcao1">opcao3</option>
                            </select>
                        </div>
                        <div class="col-6">
                            <label for="campo4" class="form-label">campo4</label>
                            <input type="text" class="form-control" id="campo4" name="campo4">
                        </div>

                        <div class="col-6">
                            <label for="campo2" class="form-label">campo2</label>
                            <input type="text" class="form-control" id="campo2" name="campo2">
                        </div>
                        <div class="col-12">
                            <button type="submit" class="btn btn-primary">Registar</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <!-- READ -->
        <div class="card">
            <div class="card-header">lista</div>
            <div class="card-body p-0">
                <table class="table table-striped table-hover mb-0">
                    <thead>
                        <tr>
                            <th>id</th>
                            <th>campo1</th>
                            <th>acoes</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaCorpo">
                    </tbody>
                </table>
            </div>
        </div>

    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.26.25/dist/sweetalert2.all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="login.js"></script>
    <script src="crud.js"></script>
</body>
</html>
