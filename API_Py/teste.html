<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <title>Consumir API de Cinemas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: Arial, sans-serif; margin: 30px; }
    input, button { padding: 8px; margin: 4px; }
    button { cursor: pointer; border-radius: 6px; border: 1px solid #ccc; }
    button.primary { background-color: #2563eb; color: white; border: none; }
    button.danger { background-color: #dc2626; color: white; border: none; }
    table { border-collapse: collapse; width: 100%; margin-top: 20px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background-color: #f3f4f6; }
    .muted { color:#666; font-size:12px; }
  </style>
</head>
<body>
  <h1>Gestão de Cinemas </h1>

  <!-- Base URL e controlos -->
  <label>Base URL:
    <input type="text" id="baseUrl" value="http://192.168.11.219:8000/" size="40" />
  </label>
  <button onclick="guardarBase()">Guardar</button>

  <h3>Novo Cinema</h3>
    <input type="text" id="nome" placeholder="Nome" />
    <input type="text" id="localidade" placeholder="Localidade" />
    <input type="number" id="telefone" placeholder="Telefone" />
  <button class="primary" onclick="criarCinema()">Criar</button>

  <h3>Pesquisar</h3>
  <input type="text" id="search" placeholder="Procurar por id" />
  <button onclick="listarCinemas()">Pesquisar</button>
  <p>Pesquisa vazia lista todos.</p>
  <p>Pesquisa com id pesquisa o cinema</p>

  <table id="tabelaCinemas">
    <thead>
      <tr>
        <th style="width:70px;">ID</th>
        <th>Nome</th>
        <th>Localidade</th>
        <th>Telefone</th>
        <th style="width:200px;">Ações</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>


    <!-- Estrutura do Modal -->
    <div class="modal fade" id="cinemaModal" tabindex="-1" aria-labelledby="bookModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
        <div class="modal-header">
            <h5 class="modal-nome" id="bookModalLabel">Ver Cinema</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body">
            <form id="bookForm">

            <input type="hidden" id="cinemaId" name="cinemaId">

            <div class="mb-3">
                <label for="inputTitle" class="form-label">Nome</label>
                <input type="text" class="form-label form-control" id="inputTitle" value="">
            </div>
            <div class="mb-3">
                <label for="inputLocalidade" class="form-label">Ano</label>
                <input type="text" class="form-control" id="inputLocalidade" value="">
            </div>
            <div class="mb-3">
                <label for="inputTelefone" class="form-label">Telefone</label>
                <input type="number" class="form-control" id="inputTelefone" value="">
            </div>
            </form>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
            <button type="button" class="btn btn-primary" data-bs-dismiss="modal" onclick = "atualizarCinema()">Guardar</button>
        </div>
        </div>
    </div>
    </div>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="teste.js"></script>
</body>
</html>
